<style>
  :root { --txt: #e6e6e6; --dim: #8e949b; --acc: #e8d27a; }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070b; color: var(--txt);
    font-family: 'Press Start 2P', 'Courier New', monospace; font-size: 12px; }
  canvas { display: block; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; text-shadow: 2px 2px 0 #000; }
  #hud.show { display: block; }
  .hudlabel { font-size: 8px; color: var(--dim); letter-spacing: 2px; margin-bottom: 6px; }
  #score { position: absolute; top: 22px; left: 24px; font-size: 22px; color: var(--acc); }
  #roundBox { position: absolute; top: 22px; right: 24px; text-align: right; font-size: 22px; }
  #zleft { font-size: 9px; color: var(--dim); margin-top: 10px; }
  #healthWrap { position: absolute; left: 24px; bottom: 24px; width: 260px; }
  #healthBar { height: 14px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.4); }
  #healthFill { height: 100%; width: 100%; background: #5fbf4a; transition: width .15s; }
  #roundNum { position: absolute; left: 30px; bottom: 20px; font: bold 62px/1 Georgia, 'Times New Roman', serif; letter-spacing: 5px; color: #b30d0d; text-shadow: 2px 2px 0 #000, 0 0 14px rgba(140,0,0,.8); }
  #roundNum.flash { animation: rflash 1.4s ease-out; }
  @keyframes rflash { 0% { opacity: 0; transform: scale(2.2); filter: blur(6px); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
  #roundNum .t5 { position: relative; display: inline-block; }
  #roundNum .t5::after { content: ''; position: absolute; left: -10px; right: -10px; top: 46%; height: 7px; background: #b30d0d; transform: rotate(-24deg); box-shadow: 1px 1px 0 #000; }
  #perks { position: absolute; left: 30px; bottom: 98px; font-size: 8px; }
  #perks b { font-weight: normal; background: #a3141a; color: #fff; padding: 6px 8px; border: 2px solid #fff; }
  #holdBar { position: absolute; left: 50%; bottom: 17%; width: 200px; margin-left: -100px; height: 10px; border: 2px solid #fff; background: rgba(0,0,0,.55); display: none; }
  #holdBar i { display: block; height: 100%; width: 0; background: var(--acc); }
  #weaponBox { position: absolute; right: 24px; bottom: 24px; text-align: right; }
  #wName { font-size: 10px; color: var(--dim); margin-bottom: 8px; }
  #wAmmo { font-size: 24px; }
  #wAmmo small { font-size: 12px; color: var(--dim); }
  #wSlots { font-size: 8px; color: var(--dim); margin-top: 8px; letter-spacing: 1px; }
  #prompt { position: absolute; left: 0; right: 0; bottom: 21%; text-align: center; font-size: 11px; color: #fff; }
  #notice { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-size: 12px; color: var(--acc); opacity: 0; transition: opacity .4s; }
  #notice.on { opacity: 1; transition: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 3px #000; }
  #crosshair i:nth-child(1) { left: -1px; top: -13px; width: 2px; height: 7px; }
  #crosshair i:nth-child(2) { left: -1px; top: 6px;   width: 2px; height: 7px; }
  #crosshair i:nth-child(3) { left: -13px; top: -1px; width: 7px; height: 2px; }
  #crosshair i:nth-child(4) { left: 6px;   top: -1px; width: 7px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; left: 50%; top: -3px; width: 2px; height: 32px; background: #fff; box-shadow: 0 0 4px #000; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.on { opacity: 1; }
  #hitmarker.head::before, #hitmarker.head::after { background: var(--acc); }
  .pop { position: absolute; left: 50%; top: 44%; font-size: 12px; color: #fff; animation: popup .9s ease-out forwards; white-space: nowrap; }
  .pop.head { color: var(--acc); font-size: 14px; }
  @keyframes popup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }

  #vignette, #lowhp, #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #vignette { background: radial-gradient(ellipse at center, rgba(120,0,0,0) 35%, rgba(150,0,0,.85) 100%); transition: opacity .35s; }
  #lowhp { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(90,0,0,.7) 100%); transition: opacity .4s; }
  #flash { background: radial-gradient(ellipse at center, rgba(160,255,120,.1) 20%, rgba(120,255,90,.55) 100%); transition: opacity 1s; }

  #banner { position: fixed; left: 0; right: 0; top: 26%; text-align: center; font-size: 30px; color: #fff; text-shadow: 3px 3px 0 #000; opacity: 0; pointer-events: none; transition: opacity .6s; letter-spacing: 3px; }
  #banner.on { opacity: 1; transition: none; }

  /* ---------- MENUS ---------- */
  .btn { display: block; width: 100%; text-align: left; background: transparent; border: none; border-left: 4px solid transparent;
    color: #cfd2d6; font-family: inherit; font-size: 13px; padding: 13px 14px; cursor: pointer; letter-spacing: 1px; text-shadow: 2px 2px 0 #000; }
  .btn:hover { color: #fff; background: rgba(255,255,255,.1); border-left-color: var(--acc); }
  .btn small { display: block; font-size: 8px; color: var(--dim); margin-top: 7px; letter-spacing: 1px; }
  .btn.back { margin-top: 18px; font-size: 10px; color: var(--dim); }

  .ctl { padding: 0 14px; font-size: 9px; line-height: 2.3; color: #cfd2d6; text-shadow: 1px 1px 0 #000; }
  .ctl b { color: var(--acc); font-weight: normal; display: inline-block; width: 120px; }

  #menu { position: fixed; left: 0; top: 0; bottom: 0; width: 400px; padding: 34px 0 24px 22px; z-index: 20;
    background: linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.6) 65%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; }
  #menuTitle { font-size: 18px; padding-left: 14px; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
  #menuSub { font-size: 8px; color: var(--dim); padding-left: 14px; margin: 10px 0 38px; letter-spacing: 2px; }
  #menuVer { margin-top: auto; padding-left: 14px; font-size: 8px; color: #5d636a; }

  #countdown { position: fixed; left: 0; right: 0; top: 16%; text-align: center; z-index: 15; text-shadow: 3px 3px 0 #000; pointer-events: none; }
  #countdown .map { font-size: 11px; color: var(--dim); letter-spacing: 3px; }
  #countdown .txt { font-size: 14px; margin: 18px 0 16px; letter-spacing: 3px; }
  #countdown .num { font-size: 56px; color: var(--acc); }

  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.62); z-index: 30; }
  .panel { width: 360px; padding: 26px 18px; background: rgba(10,12,16,.88); border: 2px solid rgba(255,255,255,.18); }
  .panel h1 { font-size: 20px; text-align: center; letter-spacing: 3px; margin-bottom: 26px; text-shadow: 3px 3px 0 #000; font-weight: normal; }
  #goStats { font-size: 10px; line-height: 2.4; text-align: center; color: #cfd2d6; margin-bottom: 22px; }
  #goStats em { color: var(--acc); font-style: normal; }
</style>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ===================================================================

const ARENA = 40;
const PLAYER_RADIUS = 0.45, PLAYER_HEIGHT = 1.7, WALK_SPEED = 5.5, SPRINT_SPEED = 8.5;
const MAX_ALIVE = 20;                 // horde cap
const ZOMBIE_BASE_HP = 100;           // +100 every round
const HP_PER_ROUND = 100;
const ZOMBIE_DAMAGE = 35, ZOMBIE_ATTACK_CD = 0.9;

const KILL_POINTS = 10, HEADSHOT_POINTS = 100;
const BOX_COST = 950, HIT_POINTS = 10, KNIFE_KILL_POINTS = 130;
const START_POINTS = 500;

const WEAPONS = {
  pistol:   { name: 'PISTOL',             dmg: 20,  delay: 0.26,  auto: false, mag: 12, reserve: Infinity, reload: 1.3, kind: 'hitscan',    spread: 0,     kick: 0.05, rot: 0.10, vm: [0.20, -0.22, -0.42] },
  ak:       { name: 'AK-47',              dmg: 50,  delay: 0.095, auto: true,  mag: 30, reserve: 120,      reload: 2.0, kind: 'hitscan',    spread: 0.006, kick: 0.07, rot: 0.06, vm: [0.24, -0.24, -0.48] },
  crossbow: { name: 'EXPLOSIVE CROSSBOW', dmg: 300, delay: 1.0,   auto: false, mag: 3,  reserve: 12,       reload: 2.4, kind: 'projectile', spread: 0,     kick: 0.10, rot: 0.14, vm: [0.20, -0.24, -0.46] },
};
const EXPLOSION_RADIUS = 5.5;
const DOOR_COST = 500, JUG_COST = 2500, PAP_COST = 5000;   // prices
WEAPONS.pistol.ads = [0, -0.075, -0.32]; WEAPONS.ak.ads = [0, -0.105, -0.32]; WEAPONS.crossbow.ads = [0, -0.1, -0.34];
WEAPONS.raygun = { name: 'RAY GUN', dmg: 250, delay: 0.32, auto: false, mag: 20, reserve: 160, reload: 2.8, kind: 'ray', spread: 0, kick: 0.06, rot: 0.08, vm: [0.2, -0.21, -0.42], ads: [0, -0.1, -0.3] };

/* ===================================================================
   HELPERS
=================================================================== */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
let seed = 1337;
const srand = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const $ = id => document.getElementById(id);

/* ===================================================================
   RENDERER / SCENE / CAMERA
=================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.FogExp2(0x0b0f18, 0.02);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
scene.add(camera);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- lighting ---------- */
scene.add(new THREE.HemisphereLight(0x6479b0, 0x1c1812, 0.65));
const moon = new THREE.DirectionalLight(0xa5b9ff, 1.15);
moon.position.set(-30, 55, -15);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -ARENA - 6, right: ARENA + 6, top: ARENA + 6, bottom: -ARENA - 6, near: 1, far: 150 });
moon.shadow.bias = -0.0005;
moon.shadow.normalBias = 0.03;
scene.add(moon);

const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 24), new THREE.MeshBasicMaterial({ color: 0xe4ebff, fog: false }));
moonMesh.position.set(-100, 120, -70);
scene.add(moonMesh);
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, e = Math.random() * 1.35 + 0.1, r = 250;
    pos[i * 3] = Math.cos(a) * Math.cos(e) * r; pos[i * 3 + 1] = Math.sin(e) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false, fog: false })));
}

/* ===================================================================
   PROCEDURAL TEXTURES
=================================================================== */
function mkCanvas(size, h = size) { const c = document.createElement('canvas'); c.width = size; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function addNoise(ctx, w, h, amt) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() - 0.5) * amt; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  ctx.putImageData(img, 0, 0);
}
function shade(hex, f) {
  const c = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((c >> 16) & 255) * f) | 0, g = Math.min(255, ((c >> 8) & 255) * f) | 0, b = Math.min(255, (c & 255) * f) | 0;
  return `rgb(${r},${g},${b})`;
}
function blob(x, size, px, py, r) {          // wrap-around circle so tiles stay seamless
  for (const ox of [0, size, -size]) for (const oy of [0, size, -size]) {
    const X = px + ox, Y = py + oy;
    if (X < -r || X > size + r || Y < -r || Y > size + r) continue;
    x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill();
  }
}

function texGrass() {
  const S = 512, [c, x] = mkCanvas(S);
  x.fillStyle = '#3e5027'; x.fillRect(0, 0, S, S);
  const cols = ['#4b602d', '#36471f', '#586d34', '#5d5c31', '#3a3f22', '#4d4a2c', '#2f4220'];
  for (let i = 0; i < 520; i++) { x.globalAlpha = rnd(0.15, 0.4); x.fillStyle = pick(cols); blob(x, S, rnd(0, S), rnd(0, S), rnd(6, 26)); }
  x.globalAlpha = 0.55;
  for (let i = 0; i < 5500; i++) {
    x.strokeStyle = Math.random() < 0.5 ? '#74903f' : '#2a3918'; x.lineWidth = 1;
    const px = rnd(0, S), py = rnd(0, S);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-2, 2), py - rnd(3, 9)); x.stroke();
  }
  x.globalAlpha = 1; addNoise(x, S, S, 22);
  return toTex(c);
}
function texGravel() {
  const S = 512, [c, x] = mkCanvas(S);
  x.fillStyle = '#78756d'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 3200; i++) {
    const g = (60 + Math.random() * 110) | 0;
    x.globalAlpha = rnd(0.5, 0.9); x.fillStyle = `rgb(${g},${g - 3},${g - 8})`; blob(x, S, rnd(0, S), rnd(0, S), rnd(1, 3.8));
  }
  x.globalAlpha = 1; addNoise(x, S, S, 26);
  return toTex(c);
}
function texPlanks(base, { n = 8, vertical = true, variance = 0.14, nails = true } = {}) {
  const S = 256, [c, x] = mkCanvas(S), pw = S / n;
  for (let i = 0; i < n; i++) {
    x.fillStyle = shade(base, rnd(1 - variance, 1 + variance));
    if (vertical) x.fillRect(i * pw, 0, pw, S); else x.fillRect(0, i * pw, S, pw);
  }
  x.strokeStyle = 'rgba(0,0,0,0.22)'; x.lineWidth = 1;
  for (let i = 0; i < 90; i++) {
    const p = Math.floor(rnd(0, n)) * pw + rnd(2, pw - 2), s = rnd(0, S), l = rnd(20, 90);
    x.beginPath();
    if (vertical) { x.moveTo(p, s); x.lineTo(p + rnd(-1, 1), s + l); } else { x.moveTo(s, p); x.lineTo(s + l, p + rnd(-1, 1)); }
    x.stroke();
  }
  x.strokeStyle = 'rgba(0,0,0,0.65)'; x.lineWidth = 2;
  for (let i = 0; i < n; i++) { x.beginPath(); if (vertical) { x.moveTo(i * pw, 0); x.lineTo(i * pw, S); } else { x.moveTo(0, i * pw); x.lineTo(S, i * pw); } x.stroke(); }
  if (nails) {
    x.fillStyle = 'rgba(20,20,20,0.7)';
    for (let i = 0; i < n; i++) for (const t of [10, S - 10]) {
      if (vertical) { x.fillRect(i * pw + pw / 2 - 1, t, 2, 2); } else { x.fillRect(t, i * pw + pw / 2 - 1, 2, 2); }
    }
  }
  addNoise(x, S, S, 14);
  return toTex(c);
}
function texMetal(base, rust = 0.25) {
  const S = 256, [c, x] = mkCanvas(S);
  x.fillStyle = base; x.fillRect(0, 0, S, S);
  for (let i = 0; i < S; i += 8) {
    x.fillStyle = 'rgba(255,255,255,0.10)'; x.fillRect(i, 0, 3, S);
    x.fillStyle = 'rgba(0,0,0,0.22)'; x.fillRect(i + 4, 0, 3, S);
  }
  for (let i = 0; i < 60 * rust * 4; i++) {
    x.fillStyle = `rgba(${(110 + Math.random() * 40) | 0},${(60 + Math.random() * 30) | 0},25,${rnd(0.05, 0.22)})`;
    x.fillRect(rnd(0, S), rnd(0, S), rnd(2, 9), rnd(15, 110));
  }
  addNoise(x, S, S, 16);
  return toTex(c);
}
function texShingles(base) {
  const S = 256, [c, x] = mkCanvas(S), rh = 16, cw = 32;
  for (let r = 0; r < S / rh; r++) for (let k = -1; k < S / cw + 1; k++) {
    const ox = (r % 2) * (cw / 2);
    x.fillStyle = shade(base, rnd(0.8, 1.15)); x.fillRect(k * cw + ox, r * rh, cw, rh);
    x.strokeStyle = 'rgba(0,0,0,0.55)'; x.lineWidth = 1.5; x.strokeRect(k * cw + ox, r * rh, cw, rh);
  }
  addNoise(x, S, S, 14);
  return toTex(c);
}
function texConcrete(base = '#7a7c7e') {
  const S = 256, [c, x] = mkCanvas(S);
  x.fillStyle = base; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 70; i++) { x.globalAlpha = rnd(0.05, 0.18); x.fillStyle = Math.random() < 0.5 ? '#000' : '#fff'; blob(x, S, rnd(0, S), rnd(0, S), rnd(8, 30)); }
  x.globalAlpha = 0.5; x.strokeStyle = '#222'; x.lineWidth = 1;
  for (let i = 0; i < 6; i++) { let px = rnd(0, S), py = rnd(0, S); x.beginPath(); x.moveTo(px, py); for (let k = 0; k < 8; k++) { px += rnd(-14, 14); py += rnd(4, 16); x.lineTo(px, py); } x.stroke(); }
  x.globalAlpha = 1; addNoise(x, S, S, 26);
  return toTex(c);
}
function texSandbag() {
  const S = 256, [c, x] = mkCanvas(S), rh = 32, bw = 64;
  x.fillStyle = '#7a6a48'; x.fillRect(0, 0, S, S);
  for (let r = 0; r < S / rh; r++) for (let k = -1; k < S / bw + 1; k++) {

/* ---------- geometry helpers with world-scale UVs ---------- */
function boxGeo(w, h, d, den = 3) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f * 4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / den, uv.getY(i) * dims[f][1] / den);
  }
  uv.needsUpdate = true; return g;
}
function planeGeo(w, h, den = 3) {
  const g = new THREE.PlaneGeometry(w, h), uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / den, uv.getY(i) * h / den);
  uv.needsUpdate = true; return g;
}

const obstacles = [];        // collision boxes
const obstacleMeshes = [];   // bullet occluders

function addSolid(x, z, w, h, d, mat, { y0 = 0, den = 3, collide = true, cast = true, occlude = true } = {}) {
  const m = new THREE.Mesh(boxGeo(w, h, d, den), mat);
  m.position.set(x, y0 + h / 2, z);
  m.castShadow = cast; m.receiveShadow = true;
  scene.add(m);
  if (occlude) obstacleMeshes.push(m);
  if (collide) obstacles.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return m;
}
function addDecal(x, y, z, w, h, mat, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry; scene.add(m); return m;
}
function addCylinder(x, z, r, h, mat, { y0 = 0, collide = true, seg = 14 } = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.position.set(x, y0 + h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  obstacleMeshes.push(m);
  if (collide) obstacles.push({ minX: x - r, maxX: x + r, minZ: z - r, maxZ: z + r });
  return m;
}
function addRoof(cx, cz, w, d, h, mat, over = 0.35, pitch = 0.32) {
  const alongX = w >= d, span = (alongX ? d : w) + over * 2, len = (alongX ? w : d) + over * 2, rh = span * pitch;
  const shape = new THREE.Shape();
  shape.moveTo(-span / 2, 0); shape.lineTo(span / 2, 0); shape.lineTo(0, rh); shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: len, bevelEnabled: false });
  g.translate(0, 0, -len / 2);
  const m = new THREE.Mesh(g, mat);
  m.position.set(cx, h, cz); if (alongX) m.rotation.y = Math.PI / 2;
  m.castShadow = true; m.receiveShadow = true; scene.add(m);
  return rh;
}
function insideObstacle(x, z, pad) {
  if (inHouse(x, z, pad)) return true;
  for (const o of obstacles) if (x > o.minX - pad && x < o.maxX + pad && z > o.minZ - pad && z < o.maxZ + pad) return true;
  return false;
}

function resolveCircle(pos, r) {
  for (const o of obstacles) {
    const cx = Math.max(o.minX, Math.min(pos.x, o.maxX)), cz = Math.max(o.minZ, Math.min(pos.z, o.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2), p = r - d; pos.x += dx / d * p; pos.z += dz / d * p; }
      else {
        const l = pos.x - o.minX, rr = o.maxX - pos.x, t = pos.z - o.minZ, b = o.maxZ - pos.z, m = Math.min(l, rr, t, b);
        if (m === l) pos.x = o.minX - r; else if (m === rr) pos.x = o.maxX + r; else if (m === t) pos.z = o.minZ - r; else pos.z = o.maxZ + r;
      }
    }
  }
  const lim = ARENA - r;
  pos.x = Math.max(-lim, Math.min(lim, pos.x)); pos.z = Math.max(-lim, Math.min(lim, pos.z));
}

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();

function updatePlayer(dt) {
  fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  if (keys['KeyA'] || keys['ArrowLeft']) wish.sub(right);

  }

      resolveCircle(gp, 0.45);
      const moved = Math.hypot(gp.x - px, gp.z - pz);
      if (moved < sp * dt * 0.35) { z.stuck += dt; if (z.stuck > 1.4) { z.side *= -1; z.stuck = 0.3; } } else z.stuck = Math.max(0, z.stuck - dt * 2);
      z.phase += dt * sp * 2.6;
    } else {
      z.attackCd -= dt;
      if (z.attackCd <= 0) { z.attackCd = ZOMBIE_ATTACK_CD; hurtPlayer(ZOMBIE_DAMAGE); }
      z.phase += dt * 2;
    }
    // separation
    for (let j = i + 1; j < zombies.length; j++) {
      const o = zombies[j]; if (o.spawnT < 0.9) continue;
      const ox = gp.x - o.root.position.x, oz = gp.z - o.root.position.z, d2 = ox * ox + oz * oz;
      if (d2 < 0.72 * 0.72 && d2 > 1e-6) { const d = Math.sqrt(d2), p = (0.72 - d) * 0.5; gp.x += ox / d * p; gp.z += oz / d * p; o.root.position.x -= ox / d * p; o.root.position.z -= oz / d * p; }
    }
    // animation: shamble / run, knees + elbows, hunched torso, lolling head
    const ph = z.phase, sw = Math.sin(ph), attacking = dist <= 1.2, run = Math.min(1, Math.max(0, (z.speed - 2) / 2)), hit = z.stagger > 0, st = z.style;
    const A = 0.5 + run * 0.45, K = 0.9 + run * 0.5;
    z.legL.rotation.x = sw * A; z.legR.rotation.x = -sw * A;
    z.kL.rotation.x = Math.max(0, -Math.cos(ph)) * K; z.kR.rotation.x = Math.max(0, Math.cos(ph)) * K;
    if (z.limp) { z.legR.rotation.x *= 0.4; z.kR.rotation.x *= 0.3; }
    const lunge = attacking ? Math.sin(t * 10 + ph) * 0.45 : 0, fw = st === 2 ? -0.5 : -1.35;
    z.armL.rotation.x = (st === 1 ? -0.3 : fw) - run * 0.3 + Math.sin(ph * 0.5) * 0.15 + lunge;
    z.armR.rotation.x = fw - run * 0.3 - Math.sin(ph * 0.5) * 0.15 - lunge - (attacking ? 0.2 : 0);
    z.armL.rotation.z = -0.12 - (st === 2 ? 0.15 : 0); z.armR.rotation.z = 0.12 + (st === 2 ? 0.15 : 0);
    z.eL.rotation.x = -0.35 - Math.sin(ph * 0.5 + 1) * 0.2 - (attacking ? 0.5 : 0); z.eR.rotation.x = -0.5 + Math.sin(ph * 0.5) * 0.2 - (attacking ? 0.4 : 0);
    z.upper.rotation.set(0.22 + run * 0.28 + (hit ? -0.45 : 0) + (attacking ? 0.12 : 0), Math.sin(ph) * 0.2, Math.sin(ph) * 0.07);
    z.head.rotation.set(-0.15 + (attacking ? 0.35 : 0) + Math.sin(ph * 1.7) * 0.08, Math.sin(ph * 0.6 + 1) * 0.25, Math.sin(ph * 0.7 + 1) * 0.2 + 0.1);
    gp.y = Math.abs(sw) * 0.05 * (1 + run);

    // scary noises when you get close
    z.growlT -= dt;
    if (dist < 14 && z.growlT <= 0 && t - state.lastGrowl > 0.4) {
      z.growlT = 2.5 + Math.random() * 3.5; state.lastGrowl = t;
      const ang = Math.atan2(gp.x - player.pos.x, gp.z - player.pos.z), rel = ang - (player.yaw + Math.PI);
      sfxGrowl(dist, -Math.sin(rel), dist < 6);
    } else if (dist >= 14 && z.growlT < 0.3) z.growlT = 0.3;

    if (z.bar) {
      const b = z.bar; b.g.position.set(gp.x, 2.2 * z.s, gp.z); b.g.quaternion.copy(camera.quaternion);
      const r = Math.max(0, z.hp / z.maxHp); b.fg.scale.x = r; b.fg.position.x = -(1 - r) * 0.5;
    }
  }
  updateDying(dt);
}
function updateDying(dt) {
  for (let i = dying.length - 1; i >= 0; i--) {
    const z = dying[i]; z.deadT += dt;
    const p = Math.min(1, z.deadT / 0.55), e = Math.sin(p * Math.PI / 2);
    z.root.rotation.x = -e * Math.PI / 2 * z.fd; z.root.position.y = -Math.max(0, z.deadT - 0.6) * 1.4;
    z.armL.rotation.x = z.armR.rotation.x = -1.3 - e * 0.9; z.armL.rotation.z = -0.3 - e * 0.5; z.armR.rotation.z = 0.3 + e * 0.5;
    z.legL.rotation.x = e * 0.25; z.legR.rotation.x = -e * 0.2; z.kL.rotation.x = z.kR.rotation.x = 0.2; z.upper.rotation.x = 0.2 * (1 - e); z.head.rotation.x = -e * 0.4;
    if (z.deadT > 1.6) { scene.remove(z.root); dying.splice(i, 1); }
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt; if (!p.ray) p.vel.y -= 7 * dt;
    const step = _v.copy(p.vel).multiplyScalar(dt), len = step.length();
    let boom = null;
    raycaster.set(p.pos, _v2.copy(step).normalize()); raycaster.far = len + 0.3;
    const targets = [];
    for (const z of zombies) targets.push(...z.meshes);
    targets.push(...obstacleMeshes);
    const hits = raycaster.intersectObjects(targets, false);
    if (hits.length) boom = hits[0].point.clone();
    else if (p.pos.y + step.y <= 0.05) { boom = p.pos.clone().addScaledVector(step, Math.max(0, (p.pos.y - 0.05) / Math.max(1e-4, -step.y))); boom.y = 0.1; }
    else if (p.life <= 0) boom = p.pos.clone();
    if (boom) { scene.remove(p.mesh); projectiles.splice(i, 1); explode(boom, p.ray); continue; }
    p.pos.add(step); p.mesh.position.copy(p.pos);
    p.mesh.lookAt(_v2.copy(p.pos).add(p.vel));
    p.trail -= dt; if (p.trail <= 0) { p.trail = 0.03; burst(p.pos, 1, p.ray ? pMat.green : pMat.smoke, 0.6, 0.5, -0.5); }
  }
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.v.y -= p.grav * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.06) { p.m.position.y = 0.06; p.v.multiplyScalar(0.3); p.v.y = 0; }
    p.m.scale.multiplyScalar(1 - dt * 0.9);
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i]; t.life -= dt; t.m.material.opacity = Math.max(0, t.life / 0.06) * 0.8;
    if (t.life <= 0) { scene.remove(t.m); t.m.geometry.dispose(); t.m.material.dispose(); tracers.splice(i, 1); }
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i]; e.t += dt; const p = e.t / 0.4;
    e.m.scale.setScalar(0.5 + p * e.R * 0.7); e.m.material.opacity = Math.max(0, 0.85 * (1 - p));
    if (p >= 1) { scene.remove(e.m); e.m.geometry.dispose(); e.m.material.dispose(); explosions.splice(i, 1); }
  }
  if (explLightT > 0) { explLightT -= dt; explLight.intensity = Math.max(0, explLightT / 0.3) * 140; if (explLightT <= 0) explLight.intensity = 0; }
}

function updateAmbient(dt) {
  for (const f of flickerLights) {
    if (f.flame) { const s = 0.85 + Math.random() * 0.3; f.flame.scale.set(s, s * (0.9 + Math.random() * 0.3), 1); f.flame.position.y = 1.8 + s * 0.25; }
    else f.light.intensity = f.base * (f.fast ? 0.8 + Math.random() * 0.4 : 0.88 + Math.sin(state.time * 9 + f.phase) * 0.05 + Math.random() * 0.07);
  }
}

function doorNear() { return !house.open && Math.hypot(player.pos.x - house.doorX, player.pos.z - (house.cz + house.d / 2)) < 3; }
function resetHouse() {
  house.open = false; house.t = 0; house.hold = 0; jug.bought = false; doorMesh.visible = true; doorMesh.position.y = house.dh / 2;
  if (!obstacles.includes(doorObs)) obstacles.push(doorObs);
  if (!obstacleMeshes.includes(doorMesh)) obstacleMeshes.push(doorMesh);
}
function openDoor() {
  state.score -= DOOR_COST; house.open = true; sfx.door(); notice('DOOR OPENED');
  obstacles.splice(obstacles.indexOf(doorObs), 1); obstacleMeshes.splice(obstacleMeshes.indexOf(doorMesh), 1);
}
function buyJug() {
  if (state.score < JUG_COST) { notice(`NEED ${JUG_COST} POINTS`); sfx.deny(); return; }
  state.score -= JUG_COST; jug.bought = true; state.maxHealth = 200; state.health = 200; sfx.heal(); sfx.buy(); notice('JUGGER-NOG! 200 HEALTH', 3000);
}
function buyPap() {
  const t = player.cur;
  if (player.pap[t]) { notice('ALREADY PACKED'); sfx.deny(); return; }
  if (state.score < PAP_COST) { notice(`NEED ${PAP_COST} POINTS`); sfx.deny(); return; }
  state.score -= PAP_COST; player.pap[t] = true; const w = WEAPONS[t], a = player.ammo[t]; a.mag = w.mag; a.res = w.reserve; state.reloading = false;
  sfx.buy(); sfx.chime(); setViewmodels(); notice(`${w.name} PACK-A-PUNCHED! DAMAGE x2`, 3000);
}
function updatePerks(dt) {
  if (doorNear() && keys['KeyE']) {
    house.hold += dt;
    if (house.hold >= 0.7) { if (state.score < DOOR_COST) { notice(`NEED ${DOOR_COST} POINTS`); sfx.deny(); house.hold = -0.8; } else { house.hold = 0; openDoor(); } }
  } else house.hold = Math.max(0, house.hold - dt * 3);
  if (house.open && house.t < 1) { house.t = Math.min(1, house.t + dt * 0.45); doorMesh.position.y = house.dh / 2 + house.t * house.dh; if (house.t >= 1) doorMesh.visible = false; }
  pap.gear.rotation.y += dt * 1.2; pap.gear.position.y = 2.42 + Math.sin(state.time * 2) * 0.04;
}
function updateInteractions() {
  let p = '';
  if (doorNear()) p = `HOLD E: OPEN DOOR [${DOOR_COST}]`;
  else if (jugNear()) p = `PRESS E: BUY JUGGER-NOG [${JUG_COST}]`;
  else if (papNear()) p = player.pap[player.cur] ? 'ALREADY PACKED' : `PRESS E: PACK-A-PUNCH [${PAP_COST}]`;
  if (boxNear()) {
    if (mbox.state === 'closed') p = `PRESS E: MYSTERY BOX [${BOX_COST}]`;
    else if (mbox.state === 'ready') p = `PRESS E: TAKE ${WEAPONS[mbox.result].name}`;
  }
  setText(el.prompt, p);
}

function update(dt) {
  state.time += dt;
  updatePlayer(dt);
  updateCombat(dt);
  updateRounds(dt);
  updateZombies(dt);
  updateProjectiles(dt);
  updateBox(dt);
  updateCan(dt);
  updatePerks(dt);
  updateInteractions();
  updateEffects(dt);
  updateHUD();
}

/* ===================================================================
   MAIN LOOP (with adaptive resolution for slower laptops / Chromebooks)
=================================================================== */
const clock = new THREE.Clock();
let fpsFrames = 0, fpsTime = 0, lowCount = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // adaptive quality
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 2) {
    const fps = fpsFrames / fpsTime; fpsFrames = 0; fpsTime = 0;
    if (state.phase === 'playing' && locked) {
      if (fps < 32) lowCount++; else lowCount = 0;
      if (lowCount >= 2 && pixelRatio > 0.6) { pixelRatio = Math.max(0.6, pixelRatio - 0.15); renderer.setPixelRatio(pixelRatio); renderer.setSize(window.innerWidth, window.innerHeight); lowCount = 0; }
    }
  }

  if (state.phase === 'playing' && locked) update(dt);
  else if (state.phase === 'menu') {
    state.time += dt; menuAngle += dt * 0.07;
    const r = 27 + Math.sin(menuAngle * 2) * 3;
    camera.position.set(Math.cos(menuAngle) * r, 8.5 + Math.sin(menuAngle * 3) * 1.2, Math.sin(menuAngle) * r);
    camera.lookAt(0, 2.2, 0);
    updateAmbient(dt); updateBox(dt); updateCan(dt); updateEffects(dt);
  } else if (state.phase === 'countdown') {
    state.time += dt; applyCamera(0); updateViewmodel(dt, 0, false, 0, 0); updateAmbient(dt); updateBox(dt); updateCan(dt);
  } else {
    state.time += dt; updateDying(state.phase === 'dead' ? dt : 0); updateEffects(state.phase === 'dead' ? dt : 0); updateBox(state.phase === 'dead' ? dt : 0);
  }
  if (state.phase === 'playing' || state.phase === 'countdown') updateAmbient(dt);
  renderer.render(scene, camera);
}

/* ---------- boot ---------- */
showMenu('main');
animate();
</script>
