<div id="startupError" role="alert"><h2>GAME DID NOT START</h2><p id="startupErrorText">The game engine has not finished loading. Check your internet connection and reload the page.</p><button type="button" onclick="location.reload()">RELOAD GAME</button></div>
<script>
(function () {
  var ready = false, timer;
  function report(message) {
    if (ready) return;
    var panel = document.getElementById('startupError');
    var text = document.getElementById('startupErrorText');
    if (panel && text) {
      text.textContent = message || 'The game engine failed to start. Check the browser console for the error.';
      panel.style.display = 'block';
    }
  }
  window.__setZombieGameReady = function () { ready = true; clearTimeout(timer); };
  window.addEventListener('error', function (e) {
    if (!ready) report('Startup error: ' + (e.message || 'A JavaScript module failed to load.') + ' Open F12 → Console and send me the first red error if it continues.');
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!ready) report('Startup error: ' + String(e.reason && (e.reason.message || e.reason) || 'A module promise failed.') + ' Check that the Three.js CDN is reachable from your website.');
  });
  document.addEventListener('DOMContentLoaded', function () {
    var buttons = document.getElementById('menuButtons');
    if (buttons) buttons.addEventListener('click', function () {
      if (!ready) report('The buttons are visible, but the game engine did not initialise. Open the browser console (F12 → Console) and send me the first red error.');
    });
    timer = setTimeout(function () {
      if (!ready) report('The game engine did not finish starting. This usually means the Three.js modules were blocked or a startup error stopped the game. Press F12 → Console and send me the first red error.');
    }, 12000);
  });
})();
</script>

/* ===================================================================
   PROCEDURAL TEXTURES
=================================================================== */
function mkCanvas(size, h = size) { const c = document.createElement('canvas'); c.width = size; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function addNoise(ctx, w, h, amt) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() - 0.5) * amt; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  ctx.putImageData(img, 0, 0);
}
function shade(hex, f) {
  const c = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((c >> 16) & 255) * f) | 0, g = Math.min(255, ((c >> 8) & 255) * f) | 0, b = Math.min(255, (c & 255) * f) | 0;
  return `rgb(${r},${g},${b})`;
}
function blob(x, size, px, py, r) {          // wrap-around circle so tiles stay seamless
  for (const ox of [0, size, -size]) for (const oy of [0, size, -size]) {
    const X = px + ox, Y = py + oy;
    if (X < -r || X > size + r || Y < -r || Y > size + r) continue;
    x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill();
  }
}

function texGrass() {
  const S = 512, [c, x] = mkCanvas(S);
  x.fillStyle = '#3e5027'; x.fillRect(0, 0, S, S);
  const cols = ['#4b602d', '#36471f', '#586d34', '#5d5c31', '#3a3f22', '#4d4a2c', '#2f4220'];
  for (let i = 0; i < 520; i++) { x.globalAlpha = rnd(0.15, 0.4); x.fillStyle = pick(cols); blob(x, S, rnd(0, S), rnd(0, S), rnd(6, 26)); }
  x.globalAlpha = 0.55;
  for (let i = 0; i < 5500; i++) {
    x.strokeStyle = Math.random() < 0.5 ? '#74903f' : '#2a3918'; x.lineWidth = 1;
    const px = rnd(0, S), py = rnd(0, S);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-2, 2), py - rnd(3, 9)); x.stroke();
  }
  x.globalAlpha = 1; addNoise(x, S, S, 22);
  return toTex(c);
}
function texGravel() {
  const S = 512, [c, x] = mkCanvas(S);
  x.fillStyle = '#78756d'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 3200; i++) {
    const g = (60 + Math.random() * 110) | 0;
    x.globalAlpha = rnd(0.5, 0.9); x.fillStyle = `rgb(${g},${g - 3},${g - 8})`; blob(x, S, rnd(0, S), rnd(0, S), rnd(1, 3.8));
  }
  x.globalAlpha = 1; addNoise(x, S, S, 26);
  return toTex(c);
}
function texPlanks(base, { n = 8, vertical = true, variance = 0.14, nails = true } = {}) {
  const S = 256, [c, x] = mkCanvas(S), pw = S / n;
  for (let i = 0; i < n; i++) {
    x.fillStyle = shade(base, rnd(1 - variance, 1 + variance));
    if (vertical) x.fillRect(i * pw, 0, pw, S); else x.fillRect(0, i * pw, S, pw);
  }
  x.strokeStyle = 'rgba(0,0,0,0.22)'; x.lineWidth = 1;
  for (let i = 0; i < 90; i++) {

function boxGeo(w, h, d, den = 3) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f * 4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / den, uv.getY(i) * dims[f][1] / den);

}

function resolveCircle(pos, r) {
  for (const o of obstacles) {
    const cx = Math.max(o.minX, Math.min(pos.x, o.maxX)), cz = Math.max(o.minZ, Math.min(pos.z, o.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2), p = r - d; pos.x += dx / d * p; pos.z += dz / d * p; }
      else {
        const l = pos.x - o.minX, rr = o.maxX - pos.x, t = pos.z - o.minZ, b = o.maxZ - pos.z, m = Math.min(l, rr, t, b);
        if (m === l) pos.x = o.minX - r; else if (m === rr) pos.x = o.maxX + r; else if (m === t) pos.z = o.minZ - r; else pos.z = o.maxZ + r;
      }
    }
  }
  pos.x = Math.max(-(AX - r), Math.min(AX - r, pos.x)); pos.z = Math.max(-(AZ - r), Math.min(AZ - r, pos.z));
}

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();

function updatePlayer(dt) {

  const m = MAPS[id];
  if (!m.built) { Object.assign(m, m.build()); m.built = true; }
  for (const k in MAPS) if (MAPS[k].root) MAPS[k].root.visible = (k === id);
  curMap = m; obstacles = m.obs; obstacleMeshes = m.occ; AX = m.ax; AZ = m.az;
  // Invisible player-only no-go footprints under elevated scenery prevent out-of-bounds camping; they don't obstruct zombie navigation.
  playerAntiCamp = id === 'factory' ? [

    {minX:-14.8,maxX:-4.2,minZ:-33.5,maxZ:-26.5}
  ] : []; 
  jug.pos.copy(m.jugPos); pap.pos.copy(m.papPos); pap.gear = m.papGear;
  mbox.pos.copy(m.boxPos); mbox.group.position.copy(m.boxPos); mbox.group.rotation.y = m.boxRot;
  scene.fog.density = m.fog;
  const sc = moon.shadow.camera; sc.left = -m.shadowX; sc.right = m.shadowX; sc.top = m.shadowZ; sc.bottom = -m.shadowZ; sc.updateProjectionMatrix();
  if (m.nav) {
    Object.assign(NAV, m.nav, { on: true, last: -1, t: 0 });
    if (!m.nav.reachDone) {
      navFlood(m.spawn.x, m.spawn.z);

function cgeo(parts) {   // merge [geo, hex] parts into one vertex-coloured geometry
  const out = [];
  for (const [g0, hex] of parts) {
    const g = g0.index ? g0.toNonIndexed() : g0, c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3), j = 1 + (Math.random() - 0.5) * 0.14;
    for (let i = 0; i < n; i++) { a[i * 3] = c.r * j; a[i * 3 + 1] = c.g * j; a[i * 3 + 2] = c.b * j; }
    g.setAttribute('color', new THREE.BufferAttribute(a, 3)); out.push(g);

function treeGeo(crown, big = 1) {   // spring tree: pale trunk, bare branches, sparse blossom / buds
  const parts = [[new THREE.CylinderGeometry(0.1 * big, 0.2 * big, 4.2, 6).translate(0, 2.1, 0), '#cdc7ba']];
  for (let i = 0; i < 8; i++) {
    const g = new THREE.CylinderGeometry(0.015, 0.05, 2.0, 4).translate(0, 1.0, 0);
    g.rotateZ(0.55 + (i % 3) * 0.2); g.rotateY(i * 0.8); g.translate(0, 2.6 + i * 0.26, 0); parts.push([g, '#5b4a3a']);
  }
  for (let i = 0; i < 16; i++) {
