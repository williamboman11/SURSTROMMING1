<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD NIGHT - 3D Zombie Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070b; font-family: Impact, 'Arial Black', 'Helvetica Neue', sans-serif; color: #fff; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.show { display: block; }

  #score { position: absolute; top: 24px; left: 28px; font-size: 44px; letter-spacing: 2px; text-shadow: 0 0 12px rgba(255,40,40,.6), 2px 2px 0 #000; }
  #score small { display: block; font-size: 14px; letter-spacing: 4px; color: #c9c9c9; opacity: .8; }
  #wave { position: absolute; top: 24px; right: 28px; text-align: right; font-size: 44px; color: #b81414; text-shadow: 0 0 14px rgba(255,0,0,.45), 2px 2px 0 #000; letter-spacing: 2px; }
  #wave small { display: block; font-size: 14px; letter-spacing: 4px; color: #c9c9c9; opacity: .8; }

  #healthWrap { position: absolute; left: 28px; bottom: 28px; width: 320px; }
  #healthLabel { font-size: 14px; letter-spacing: 4px; color: #ccc; margin-bottom: 6px; }
  #healthBar { height: 16px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.35); transform: skewX(-18deg); overflow: hidden; }
  #healthFill { height: 100%; width: 100%; background: linear-gradient(90deg, #9b0f0f, #e22b2b); transition: width .15s; }

  #ammoWrap { position: absolute; right: 28px; bottom: 24px; text-align: right; text-shadow: 2px 2px 0 #000; }
  #ammo { font-size: 64px; letter-spacing: 2px; line-height: 1; }
  #ammo span { font-size: 28px; color: #aaa; }
  #ammoHint { font-size: 14px; letter-spacing: 4px; color: #ffd24a; height: 18px; margin-top: 4px; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 3px #000; }
  #crosshair i:nth-child(1) { left: -1px; top: -14px; width: 2px; height: 8px; }
  #crosshair i:nth-child(2) { left: -1px; top: 6px;   width: 2px; height: 8px; }
  #crosshair i:nth-child(3) { left: -14px; top: -1px; width: 8px; height: 2px; }
  #crosshair i:nth-child(4) { left: 6px;   top: -1px; width: 8px; height: 2px; }
  #crosshair.hit i { background: #ff3030; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; opacity: 0; transition: opacity .12s; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; left: 50%; top: -4px; width: 3px; height: 38px; background: #ff3030; box-shadow: 0 0 6px #f00; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.on { opacity: 1; transition: none; }

  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(120,0,0,0) 35%, rgba(150,0,0,.85) 100%); transition: opacity .35s; }
  #lowhp { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(90,0,0,.7) 100%); transition: opacity .4s; }

  #banner { position: fixed; left: 0; right: 0; top: 22%; text-align: center; font-size: 82px; letter-spacing: 10px; color: #c41212; text-shadow: 0 0 30px rgba(255,0,0,.6), 3px 3px 0 #000; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #banner.on { opacity: 1; transition: none; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(20,6,6,.82), rgba(0,0,0,.95)); z-index: 10; text-align: center; cursor: pointer; }
  .screen.hidden { display: none; }
  .screen h1 { font-size: 110px; letter-spacing: 14px; color: #c41212; text-shadow: 0 0 40px rgba(255,0,0,.55), 4px 4px 0 #000; }
  .screen h2 { font-size: 20px; letter-spacing: 8px; color: #888; margin: 6px 0 40px; font-weight: normal; }
  .screen .big { font-size: 28px; letter-spacing: 6px; padding: 16px 44px; border: 3px solid #c41212; color: #fff; background: rgba(120,0,0,.35); margin-bottom: 36px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { background: rgba(190,0,0,.55); box-shadow: 0 0 30px rgba(255,0,0,.4); } }
  .controls { display: grid; grid-template-columns: auto auto; gap: 8px 28px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; color: #bbb; text-align: left; letter-spacing: 1px; }
  .controls b { color: #fff; letter-spacing: 2px; }
  #goStats { font-size: 30px; letter-spacing: 4px; margin: 10px 0 34px; line-height: 1.7; color: #ddd; }
  #goStats em { color: #ff3b3b; font-style: normal; }
</style>

<script type="module">
import * as THREE from 'three';

/* ===================================================================
   CONFIG
=================================================================== */
const ARENA = 40;                 // half-size of the play area
const PLAYER_RADIUS = 0.45;
const PLAYER_HEIGHT = 1.7;
const WALK_SPEED = 5.5;
const SPRINT_SPEED = 8.5;
const MAG_SIZE = 30;
const RELOAD_TIME = 1.5;
const FIRE_DELAY = 0.11;
const POINTS_PER_KILL = 10;
const KILLS_PER_WAVE = 10;
const ZOMBIE_DAMAGE = 15;
const ZOMBIE_ATTACK_COOLDOWN = 0.9;

/* ===================================================================
   RENDERER / SCENE / CAMERA
=================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.FogExp2(0x0a0d16, 0.024);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 300);
camera.rotation.order = 'YXZ';
scene.add(camera);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ===================================================================
   LIGHTING
=================================================================== */
scene.add(new THREE.HemisphereLight(0x5a6fa8, 0x1a1410, 0.55));

const moon = new THREE.DirectionalLight(0x9db4ff, 1.1);
moon.position.set(-30, 50, -20);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -ARENA - 5;
moon.shadow.camera.right = ARENA + 5;
moon.shadow.camera.top = ARENA + 5;
moon.shadow.camera.bottom = -ARENA - 5;
moon.shadow.camera.near = 1;
moon.shadow.camera.far = 140;
moon.shadow.bias = -0.0005;
scene.add(moon);

// moon sphere + stars
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(7, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xdfe8ff, fog: false })
);
moonMesh.position.set(-90, 110, -80);
scene.add(moonMesh);

{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const e = Math.random() * 1.35 + 0.1;
    const r = 220;
    pos[i * 3]     = Math.cos(a) * Math.cos(e) * r;
    pos[i * 3 + 1] = Math.sin(e) * r;
    pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false, fog: false })));
}

/* ===================================================================
   TEXTURES
=================================================================== */
function makeNoiseTexture(base, variance, size, repeat, lines) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = (Math.random() - 0.5) * variance;
    img.data[i] += v; img.data[i + 1] += v; img.data[i + 2] += v;
  }
  ctx.putImageData(img, 0, 0);
  if (lines) {
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 3;
    for (let i = 0; i <= size; i += size / lines) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function makeCrateTexture() {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = `rgba(${40 + Math.random() * 40},${25 + Math.random() * 25},10,${Math.random() * 0.25})`;
    ctx.fillRect(0, Math.random() * s, s, 2 + Math.random() * 5);
  }
  ctx.strokeStyle = '#3a2512'; ctx.lineWidth = 14; ctx.strokeRect(7, 7, s - 14, s - 14);
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(s - 10, s - 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s - 10, 10); ctx.lineTo(10, s - 10); ctx.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ===================================================================
   WORLD
=================================================================== */
const groundTex = makeNoiseTexture('#2b2f24', 40, 512, ARENA / 4, 8);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA * 2, ARENA * 2),
  new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// huge outer ground so the void isn't visible
const outer = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0x0c0e10, roughness: 1 })
);
outer.rotation.x = -Math.PI / 2;
outer.position.y = -0.05;
scene.add(outer);

const obstacles = [];       // AABBs for collision
const obstacleMeshes = [];  // meshes for bullet occlusion

function addBox(x, z, w, h, d, material, y0 = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y0 + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  obstacleMeshes.push(m);
  obstacles.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return m;
}

// perimeter walls
const wallTex = makeNoiseTexture('#3a3d42', 50, 256, 1, 4);
wallTex.repeat.set(10, 1);
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
const WALL_H = 6, WALL_T = 2;
addBox(0, -ARENA - WALL_T / 2, ARENA * 2 + WALL_T * 2, WALL_H, WALL_T, wallMat);
addBox(0,  ARENA + WALL_T / 2, ARENA * 2 + WALL_T * 2, WALL_H, WALL_T, wallMat);
addBox(-ARENA - WALL_T / 2, 0, WALL_T, WALL_H, ARENA * 2, wallMat);
addBox( ARENA + WALL_T / 2, 0, WALL_T, WALL_H, ARENA * 2, wallMat);

// crates, pillars, barricades (seeded layout)
const crateMat = new THREE.MeshStandardMaterial({ map: makeCrateTexture(), roughness: 0.85 });
const concreteMat = new THREE.MeshStandardMaterial({ map: makeNoiseTexture('#5a5d60', 60, 256, 2), roughness: 0.9 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x3b4650, roughness: 0.45, metalness: 0.7 });

let seed = 1337;
const rand = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };

for (let i = 0; i < 18; i++) {
  let x, z, tries = 0;
  do { x = (rand() * 2 - 1) * (ARENA - 6); z = (rand() * 2 - 1) * (ARENA - 6); tries++; }
  while (Math.hypot(x, z) < 8 && tries < 50);
  const s = 1.6 + rand() * 1.8;
  const m = addBox(x, z, s, s, s, crateMat);
  m.rotation.y = 0; // keep axis-aligned for collision
  if (rand() > 0.6) addBox(x + 0.2, z, s * 0.7, s * 0.7, s * 0.7, crateMat, s); // stacked
}
const pillars = [[-14, -14], [14, -14], [-14, 14], [14, 14], [0, -24], [0, 24], [-26, 0], [26, 0]];
for (const [x, z] of pillars) addBox(x, z, 2.2, 6, 2.2, concreteMat);

// low barricade walls
addBox(-8, 6, 8, 1.4, 0.6, concreteMat);
addBox(9, -7, 0.6, 1.4, 8, concreteMat);
addBox(-18, -6, 0.6, 1.4, 7, concreteMat);
addBox(20, 10, 7, 1.4, 0.6, concreteMat);

// a few barrels (decor w/ collision)
const barrelGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 14);
for (const [x, z] of [[5, 8], [-6, -9], [12, 4], [-12, 12], [3, -14]]) {
  const b = new THREE.Mesh(barrelGeo, metalMat);
  b.position.set(x, 0.6, z);
  b.castShadow = b.receiveShadow = true;
  scene.add(b);
  obstacleMeshes.push(b);
  obstacles.push({ minX: x - 0.5, maxX: x + 0.5, minZ: z - 0.5, maxZ: z + 0.5 });
}

// lamp posts with warm lights
const lampPostMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.5 });
const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xffc27a });
const flickerLights = [];
for (const [x, z] of [[-30, -30], [30, -30], [-30, 30], [30, 30], [0, -8], [0, 10]]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 5, 8), lampPostMat);
  post.position.set(x, 2.5, z);
  post.castShadow = true;
  scene.add(post);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), lampBulbMat);
  bulb.position.set(x, 5.1, z);
  scene.add(bulb);
  const l = new THREE.PointLight(0xffa860, 55, 28, 2);
  l.position.set(x, 4.9, z);
  scene.add(l);
  flickerLights.push({ light: l, base: 55, phase: Math.random() * 10 });
  obstacles.push({ minX: x - 0.15, maxX: x + 0.15, minZ: z - 0.15, maxZ: z + 0.15 });
}

// collision helpers
function resolveCircle(pos, r) {
  for (const o of obstacles) {
    const cx = Math.max(o.minX, Math.min(pos.x, o.maxX));
    const cz = Math.max(o.minZ, Math.min(pos.z, o.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2), push = r - d;
        pos.x += (dx / d) * push;
        pos.z += (dz / d) * push;
      } else {
        const l = pos.x - o.minX, rr = o.maxX - pos.x, t = pos.z - o.minZ, b = o.maxZ - pos.z;
        const m = Math.min(l, rr, t, b);
        if (m === l) pos.x = o.minX - r;
        else if (m === rr) pos.x = o.maxX + r;
        else if (m === t) pos.z = o.minZ - r;
        else pos.z = o.maxZ + r;
      }
    }
  }
  const lim = ARENA - r;
  pos.x = Math.max(-lim, Math.min(lim, pos.x));
  pos.z = Math.max(-lim, Math.min(lim, pos.z));
}

function insideObstacle(x, z, pad) {
  for (const o of obstacles) {
    if (x > o.minX - pad && x < o.maxX + pad && z > o.minZ - pad && z < o.maxZ + pad) return true;
  }
  return false;
}

/* ===================================================================
   PLAYER GUN MODEL
=================================================================== */
const gun = new THREE.Group();
{
  const dark = new THREE.MeshStandardMaterial({ color: 0x1b1d20, roughness: 0.4, metalness: 0.8 });
  const mid  = new THREE.MeshStandardMaterial({ color: 0x33373c, roughness: 0.5, metalness: 0.7 });
  const wood = new THREE.MeshStandardMaterial({ color: 0x5a3a1c, roughness: 0.8 });
  const parts = [
    [new THREE.BoxGeometry(0.07, 0.11, 0.5), dark, 0, 0, 0],
    [new THREE.BoxGeometry(0.055, 0.07, 0.3), mid, 0, 0.02, -0.38],
    [new THREE.CylinderGeometry(0.018, 0.018, 0.28, 10), dark, 0, 0.02, -0.62, true],
    [new THREE.BoxGeometry(0.06, 0.2, 0.09), mid, 0, -0.14, -0.04, false, 0.2],
    [new THREE.BoxGeometry(0.06, 0.15, 0.07), wood, 0, -0.12, 0.18, false, -0.35],
    [new THREE.BoxGeometry(0.06, 0.1, 0.22), wood, 0, -0.02, 0.38],
    [new THREE.BoxGeometry(0.015, 0.04, 0.015), dark, 0, 0.085, -0.5],
    [new THREE.BoxGeometry(0.02, 0.03, 0.03), dark, 0, 0.075, 0.08],
  ];
  for (const [geo, mat, x, y, z, rotX, tilt] of parts) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (rotX === true) m.rotation.x = Math.PI / 2;
    if (typeof rotX === 'boolean' && !rotX && tilt) m.rotation.x = tilt;
    gun.add(m);
  }
}
gun.position.set(0.26, -0.24, -0.5);
camera.add(gun);
const gunBase = gun.position.clone();

// muzzle flash
const muzzleFlash = new THREE.Mesh(
  new THREE.PlaneGeometry(0.32, 0.32),
  new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })
);
muzzleFlash.position.set(0, 0.02, -0.82);
muzzleFlash.visible = false;
gun.add(muzzleFlash);
const muzzleLight = new THREE.PointLight(0xffb060, 0, 12, 2);
muzzleLight.position.set(0, 0.02, -0.9);
gun.add(muzzleLight);

/* ===================================================================
   AUDIO (procedural)
=================================================================== */
let audioCtx = null, noiseBuf = null;
function initAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { audioCtx = null; }
}
function sfxShoot() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
  const f = audioCtx.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(5000, t); f.frequency.exponentialRampToValueAtTime(300, t + 0.14);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(t); src.stop(t + 0.18);
  const o = audioCtx.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.35, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(og); og.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.13);
}
function sfxTone(type, f0, f1, dur, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfxKill   = () => { sfxTone('sawtooth', 220, 60, 0.22, 0.25); sfxTone('square', 880, 1320, 0.06, 0.08); };
const sfxHurt   = () => sfxTone('sawtooth', 120, 40, 0.3, 0.4);
const sfxReload = () => { sfxTone('square', 300, 200, 0.06, 0.15); setTimeout(() => sfxTone('square', 220, 400, 0.08, 0.15), RELOAD_TIME * 800); };
const sfxEmpty  = () => sfxTone('square', 600, 500, 0.04, 0.12);
const sfxWave   = () => { sfxTone('sawtooth', 90, 45, 1.2, 0.35); sfxTone('sine', 60, 30, 1.4, 0.4); };
const sfxGroan  = () => sfxTone('sawtooth', 70 + Math.random() * 40, 40, 0.7, 0.07);

/* ===================================================================
   ZOMBIES
=================================================================== */
const zombies = [];
const zBodyMats = [0xb01212, 0xc41a1a, 0x9c0e0e, 0xd02020].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.05, emissive: 0x330000, emissiveIntensity: 0.6 })
);
const zDarkMat = new THREE.MeshStandardMaterial({ color: 0x6a0a0a, roughness: 0.8, emissive: 0x1a0000 });
const zEyeMat  = new THREE.MeshBasicMaterial({ color: 0xffee33, fog: false });

const G = {
  body: new THREE.BoxGeometry(0.7, 0.9, 0.4),
  head: new THREE.BoxGeometry(0.46, 0.46, 0.46),
  arm:  new THREE.BoxGeometry(0.2, 0.75, 0.2),
  leg:  new THREE.BoxGeometry(0.26, 0.85, 0.26),
  eye:  new THREE.BoxGeometry(0.09, 0.07, 0.04),
};

function createZombie(x, z, wave) {
  const group = new THREE.Group();
  const bodyMat = zBodyMats[(Math.random() * zBodyMats.length) | 0];
  const meshes = [];
  const add = (geo, mat, parent, px, py, pz) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz);
    m.castShadow = true;
    parent.add(m);
    meshes.push(m);
    return m;
  };

  const body = add(G.body, bodyMat, group, 0, 1.3, 0);
  const head = add(G.head, bodyMat, group, 0, 2.0, 0);
  add(G.eye, zEyeMat, head, -0.12, 0.05, 0.235).castShadow = false;
  add(G.eye, zEyeMat, head,  0.12, 0.05, 0.235).castShadow = false;

  // arms (pivot at shoulder), extended forward like a classic zombie
  const armL = new THREE.Group(); armL.position.set(-0.46, 1.68, 0);
  const armR = new THREE.Group(); armR.position.set( 0.46, 1.68, 0);
  group.add(armL, armR);
  add(G.arm, zDarkMat, armL, 0, -0.32, 0);
  add(G.arm, zDarkMat, armR, 0, -0.32, 0);
  armL.rotation.x = armR.rotation.x = -Math.PI / 2 + 0.15;

  // legs (pivot at hip)
  const legL = new THREE.Group(); legL.position.set(-0.18, 0.85, 0);
  const legR = new THREE.Group(); legR.position.set( 0.18, 0.85, 0);
  group.add(legL, legR);
  add(G.leg, zDarkMat, legL, 0, -0.42, 0);
  add(G.leg, zDarkMat, legR, 0, -0.42, 0);

  group.position.set(x, -2.4, z);   // rises out of the ground
  scene.add(group);

  const z_ = {
    group, meshes, body, head, armL, armR, legL, legR,
    speed: Math.min(1.7 + wave * 0.22 + Math.random() * 0.7, 5.0),
    phase: Math.random() * 10,
    attackCd: 0,
    spawnT: 0,
    groanT: 3 + Math.random() * 8,
    dead: false,
  };
  meshes.forEach(m => { m.userData.zombie = z_; });
  zombies.push(z_);
  return z_;
}

function removeZombie(z) {
  scene.remove(z.group);
  const i = zombies.indexOf(z);
  if (i >= 0) zombies.splice(i, 1);
}

/* ===================================================================
   PARTICLES / TRACERS
=================================================================== */
const particles = [];
const pGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
const pMatBlood = new THREE.MeshBasicMaterial({ color: 0x8a0000 });
const pMatSpark = new THREE.MeshBasicMaterial({ color: 0xffcc66 });

function burst(point, count, mat, speed, life) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(pGeo, mat);
    m.position.copy(point);
    const s = 0.4 + Math.random() * 0.9;
    m.scale.setScalar(s);
    scene.add(m);
    particles.push({
      m,
      v: new THREE.Vector3((Math.random() - 0.5) * speed, Math.random() * speed * 0.9, (Math.random() - 0.5) * speed),
      life: life * (0.6 + Math.random() * 0.6),
      grav: mat === pMatSpark ? 6 : 14,
    });
  }
}

const tracers = [];
function spawnTracer(from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.015, 0.015, len),
    new THREE.MeshBasicMaterial({ color: 0xffe2a0, transparent: true, opacity: 0.8, fog: false })
  );
  m.position.copy(from).addScaledVector(dir, 0.5);
  m.lookAt(to);
  scene.add(m);
  tracers.push({ m, life: 0.06 });
}

/* ===================================================================
   GAME STATE
=================================================================== */
const state = {
  running: false, dead: false,
  score: 0, kills: 0, wave: 1,
  health: 100, lastHurt: -10,
  ammo: MAG_SIZE, reloading: false, reloadT: 0,
  fireCd: 0, mouseDown: false,
  spawnT: 1.0,
  time: 0,
  recoil: 0, flashT: 0,
};
const player = {
  pos: new THREE.Vector3(0, 0, 0),
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0, bob: 0,
};
const keys = {};
let best = 0;
try { best = parseInt(localStorage.getItem('deadnight_best') || '0', 10) || 0; } catch (e) {}

/* ===================================================================
   HUD
=================================================================== */
const $ = id => document.getElementById(id);
const hud = $('hud'), scoreVal = $('scoreVal'), waveVal = $('waveVal');
const healthFill = $('healthFill'), ammoEl = $('ammo'), ammoHint = $('ammoHint');
const vignette = $('vignette'), lowhp = $('lowhp'), banner = $('banner');
const hitmarker = $('hitmarker');

function updateHUD() {
  scoreVal.textContent = state.score;
  waveVal.textContent = state.wave;
  healthFill.style.width = Math.max(0, state.health) + '%';
  ammoEl.innerHTML = state.ammo + ' <span>/ &infin;</span>';
  ammoHint.textContent = state.reloading ? 'RELOADING...' : (state.ammo === 0 ? 'PRESS R TO RELOAD' : (state.ammo <= 8 ? 'LOW AMMO' : ''));
  lowhp.style.opacity = state.health < 40 ? (1 - state.health / 40).toFixed(2) : 0;
}

let bannerTimer = 0;
function showBanner(text, ms = 2200) {
  banner.textContent = text;
  banner.classList.add('on');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove('on'), ms);
}

let hitTimer = 0;
function flashHitmarker() {
  hitmarker.classList.add('on');
  clearTimeout(hitTimer);
  hitTimer = setTimeout(() => hitmarker.classList.remove('on'), 90);
}

/* ===================================================================
   INPUT / POINTER LOCK / SCREENS
=================================================================== */
const startScreen = $('startScreen'), pauseScreen = $('pauseScreen'), goScreen = $('gameOverScreen');
const canvas = renderer.domElement;

function lock() { canvas.requestPointerLock(); }

startScreen.addEventListener('click', () => { initAudio(); lock(); });
pauseScreen.addEventListener('click', () => { initAudio(); lock(); });
goScreen.addEventListener('click', () => { initAudio(); resetGame(); lock(); });

document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if (locked) {
    state.running = true;
    startScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    hud.classList.add('show');
    clock.getDelta(); // discard paused time
  } else {
    state.running = false;
    state.mouseDown = false;
    if (!state.dead) pauseScreen.classList.remove('hidden');
  }
});

document.addEventListener('mousemove', e => {
  if (!state.running) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
});
document.addEventListener('mousedown', e => { if (e.button === 0 && state.running) state.mouseDown = true; });
document.addEventListener('mouseup',   e => { if (e.button === 0) state.mouseDown = false; });
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && state.running) startReload();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ===================================================================
   SHOOTING
=================================================================== */
const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0, 0);
raycaster.far = 150;
const _v = new THREE.Vector3();

function startReload() {
  if (state.reloading || state.ammo === MAG_SIZE) return;
  state.reloading = true;
  state.reloadT = RELOAD_TIME;
  sfxReload();
}

function shoot() {
  if (state.reloading) return;
  if (state.ammo <= 0) { sfxEmpty(); state.fireCd = 0.25; startReload(); return; }

  state.ammo--;
  state.fireCd = FIRE_DELAY;
  state.recoil = 1;
  state.flashT = 0.045;
  muzzleFlash.visible = true;
  muzzleFlash.rotation.z = Math.random() * Math.PI;
  muzzleFlash.scale.setScalar(0.8 + Math.random() * 0.6);
  muzzleLight.intensity = 6;
  sfxShoot();

  // tiny camera kick
  player.pitch = Math.min(Math.PI / 2 - 0.01, player.pitch + 0.0035);
  player.yaw += (Math.random() - 0.5) * 0.0025;

  // --- the raycast ---
  raycaster.setFromCamera(center, camera);
  const targets = [];
  for (const z of zombies) if (!z.dead) targets.push(...z.meshes);
  targets.push(...obstacleMeshes);
  const hits = raycaster.intersectObjects(targets, false);

  const muzzleWorld = gun.localToWorld(new THREE.Vector3(0, 0.02, -0.8));
  let endPoint;
  if (hits.length) {
    const hit = hits[0];
    endPoint = hit.point;
    const z = hit.object.userData.zombie;
    if (z) {
      killZombie(z, hit.point);
    } else {
      burst(hit.point, 5, pMatSpark, 4, 0.35);
    }
  } else {
    endPoint = raycaster.ray.at(80, _v).clone();
  }
  spawnTracer(muzzleWorld, endPoint);

  if (state.ammo === 0) startReload();
}

function killZombie(z, point) {
  z.dead = true;
  removeZombie(z);
  burst(point, 16, pMatBlood, 7, 0.9);
  burst(z.group.position.clone().setY(1.3), 10, pMatBlood, 5, 0.9);
  state.score += POINTS_PER_KILL;
  state.kills++;
  sfxKill();
  flashHitmarker();

  const newWave = 1 + Math.floor(state.kills / KILLS_PER_WAVE);
  if (newWave > state.wave) {
    state.wave = newWave;
    showBanner('ROUND ' + state.wave);
    sfxWave();
  }
  updateHUD();
}

/* ===================================================================
   SPAWNING
=================================================================== */
function spawnZombie() {
  let x, z, tries = 0;
  do {
    const a = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 16;
    x = player.pos.x + Math.cos(a) * r;
    z = player.pos.z + Math.sin(a) * r;
    tries++;
  } while (
    tries < 40 &&
    (Math.abs(x) > ARENA - 2 || Math.abs(z) > ARENA - 2 || insideObstacle(x, z, 1.0) ||
     Math.hypot(x - player.pos.x, z - player.pos.z) < 18)
  );
  if (tries >= 40) return;
  createZombie(x, z, state.wave);
}

/* ===================================================================
   RESET
=================================================================== */
function resetGame() {
  for (const z of [...zombies]) removeZombie(z);
  for (const p of particles) scene.remove(p.m);
  particles.length = 0;
  state.dead = false;
  state.score = 0; state.kills = 0; state.wave = 1;
  state.health = 100; state.lastHurt = -10;
  state.ammo = MAG_SIZE; state.reloading = false; state.reloadT = 0;
  state.fireCd = 0; state.spawnT = 1.5;
  state.recoil = 0;
  player.pos.set(0, 0, 0); player.vel.set(0, 0, 0);
  player.yaw = 0; player.pitch = 0;
  goScreen.classList.add('hidden');
  updateHUD();
  showBanner('ROUND 1', 2000);
}

function gameOver() {
  state.dead = true;
  state.running = false;
  state.mouseDown = false;
  if (state.score > best) {
    best = state.score;
    try { localStorage.setItem('deadnight_best', String(best)); } catch (e) {}
  }
  document.exitPointerLock();
  $('goStats').innerHTML =
    `POINTS: <em>${state.score}</em><br>ZOMBIES KILLED: <em>${state.kills}</em><br>REACHED ROUND: <em>${state.wave}</em><br>BEST: <em>${best}</em>`;
  hud.classList.remove('show');
  pauseScreen.classList.add('hidden');
  goScreen.classList.remove('hidden');
}

/* ===================================================================
   MAIN UPDATE
=================================================================== */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();

function updatePlayer(dt) {
  fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  wish.set(0, 0, 0);
  if (keys['KeyW'] || keys['ArrowUp'])    wish.add(fwd);
  if (keys['KeyS'] || keys['ArrowDown'])  wish.sub(fwd);
  if (keys['KeyD'] || keys['ArrowRight']) wish.add(right);
  if (keys['KeyA'] || keys['ArrowLeft'])  wish.sub(right);
  const moving = wish.lengthSq() > 0;
  if (moving) wish.normalize();

  const sprinting = (keys['ShiftLeft'] || keys['ShiftRight']) && !state.reloading && moving;
  const speed = sprinting ? SPRINT_SPEED : WALK_SPEED;
  const k = 1 - Math.exp(-12 * dt);
  player.vel.x += (wish.x * speed - player.vel.x) * k;
  player.vel.z += (wish.z * speed - player.vel.z) * k;

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  resolveCircle(player.pos, PLAYER_RADIUS);

  const spd = Math.hypot(player.vel.x, player.vel.z);
  player.bob += dt * spd * 1.9;
  const bobY = Math.sin(player.bob * 2) * 0.035 * Math.min(1, spd / WALK_SPEED);
  const bobX = Math.cos(player.bob) * 0.02 * Math.min(1, spd / WALK_SPEED);

  camera.position.set(player.pos.x, PLAYER_HEIGHT + bobY, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  // gun sway / recoil / reload dip
  state.recoil = Math.max(0, state.recoil - dt * 12);
  const reloadDip = state.reloading ? Math.sin(Math.min(1, (RELOAD_TIME - state.reloadT) / RELOAD_TIME) * Math.PI) : 0;
  gun.position.set(
    gunBase.x + bobX * 0.5,
    gunBase.y + bobY * 0.5 - reloadDip * 0.22,
    gunBase.z + state.recoil * 0.07
  );
  gun.rotation.set(state.recoil * 0.06 + reloadDip * 0.7, 0, reloadDip * -0.4);
  if (sprinting) { gun.rotation.y = -0.25; gun.position.x -= 0.05; } else gun.rotation.y = 0;

  // muzzle flash timeout
  if (state.flashT > 0) {
    state.flashT -= dt;
    if (state.flashT <= 0) { muzzleFlash.visible = false; muzzleLight.intensity = 0; }
  }
}

function updateZombies(dt) {
  for (let i = 0; i < zombies.length; i++) {
    const z = zombies[i];
    const gp = z.group.position;

    // rise from the ground
    if (z.spawnT < 0.9) {
      z.spawnT += dt;
      gp.y = -2.4 + Math.min(1, z.spawnT / 0.9) * 2.4;
      if (z.spawnT >= 0.9) gp.y = 0;
      continue;
    }

    const dx = player.pos.x - gp.x, dz = player.pos.z - gp.z;
    const dist = Math.hypot(dx, dz);

    // face the player
    const targetYaw = Math.atan2(dx, dz);
    let dy = targetYaw - z.group.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    z.group.rotation.y += dy * Math.min(1, dt * 8);

    if (dist > 1.15) {
      const sp = z.speed;
      gp.x += (dx / dist) * sp * dt;
      gp.z += (dz / dist) * sp * dt;
      z.phase += dt * sp * 2.6;
    } else {
      z.attackCd -= dt;
      if (z.attackCd <= 0) {
        z.attackCd = ZOMBIE_ATTACK_COOLDOWN;
        hurtPlayer(ZOMBIE_DAMAGE);
      }
    }

    // separation from other zombies
    for (let j = i + 1; j < zombies.length; j++) {
      const o = zombies[j];
      const ox = gp.x - o.group.position.x, oz = gp.z - o.group.position.z;
      const d2 = ox * ox + oz * oz;
      if (d2 < 0.8 * 0.8 && d2 > 1e-6) {
        const d = Math.sqrt(d2), p = (0.8 - d) * 0.5;
        gp.x += (ox / d) * p; gp.z += (oz / d) * p;
        o.group.position.x -= (ox / d) * p; o.group.position.z -= (oz / d) * p;
      }
    }

    resolveCircle(gp, 0.45);

    // walk animation
    const sw = Math.sin(z.phase);
    z.legL.rotation.x =  sw * 0.7;
    z.legR.rotation.x = -sw * 0.7;
    z.armL.rotation.x = -Math.PI / 2 + 0.15 + Math.sin(z.phase * 0.5) * 0.12;
    z.armR.rotation.x = -Math.PI / 2 + 0.15 - Math.sin(z.phase * 0.5) * 0.12;
    z.body.rotation.z = Math.sin(z.phase) * 0.06;
    z.head.rotation.z = Math.sin(z.phase * 0.7 + 1) * 0.12;
    gp.y = Math.abs(Math.sin(z.phase)) * 0.04;

    z.groanT -= dt;
    if (z.groanT <= 0) { z.groanT = 5 + Math.random() * 10; if (dist < 25) sfxGroan(); }
  }
}

function hurtPlayer(dmg) {
  state.health -= dmg;
  state.lastHurt = state.time;
  vignette.style.opacity = 1;
  setTimeout(() => { vignette.style.opacity = 0; }, 160);
  sfxHurt();
  updateHUD();
  if (state.health <= 0) gameOver();
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.v.y -= p.grav * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.m.position.y < 0.06) { p.m.position.y = 0.06; p.v.multiplyScalar(0.3); p.v.y = 0; }
    p.m.scale.multiplyScalar(1 - dt * 0.8);
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i];
    t.life -= dt;
    t.m.material.opacity = Math.max(0, t.life / 0.06) * 0.8;
    if (t.life <= 0) {
      scene.remove(t.m);
      t.m.geometry.dispose(); t.m.material.dispose();
      tracers.splice(i, 1);
    }
  }
  for (const f of flickerLights) {
    f.light.intensity = f.base * (0.88 + Math.sin(state.time * 9 + f.phase) * 0.05 + Math.random() * 0.07);
  }
}

function update(dt) {
  state.time += dt;

  updatePlayer(dt);

  // firing
  state.fireCd -= dt;
  if (state.mouseDown && state.fireCd <= 0) shoot();

  // reloading
  if (state.reloading) {
    state.reloadT -= dt;
    if (state.reloadT <= 0) {
      state.reloading = false;
      state.ammo = MAG_SIZE;
      updateHUD();
    }
  }
  ammoHint.textContent = state.reloading ? 'RELOADING...' : (state.ammo === 0 ? 'PRESS R TO RELOAD' : (state.ammo <= 8 ? 'LOW AMMO' : ''));
  ammoEl.innerHTML = state.ammo + ' <span>/ &infin;</span>';

  // health regen after a while
  if (state.health < 100 && state.time - state.lastHurt > 6) {
    state.health = Math.min(100, state.health + dt * 14);
    updateHUD();
  }

  // constant spawning
  state.spawnT -= dt;
  const maxAlive = 8 + state.wave * 3;
  if (state.spawnT <= 0) {
    state.spawnT = Math.max(0.35, 1.7 - state.wave * 0.12) * (0.7 + Math.random() * 0.6);
    if (zombies.length < maxAlive) spawnZombie();
  }

  updateZombies(dt);
  updateEffects(dt);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state.running) update(dt);
  else {
    // idle: keep the world alive behind the menus
    state.time += dt;
    for (const f of flickerLights) f.light.intensity = f.base * (0.9 + Math.sin(state.time * 9 + f.phase) * 0.05);
    if (!state.dead && !state.running) {
      camera.position.set(0, PLAYER_HEIGHT, 0);
      camera.rotation.set(0, player.yaw + dt * 0, 0);
    }
  }
  renderer.render(scene, camera);
}

// initial state
camera.position.set(0, PLAYER_HEIGHT, 0);
updateHUD();
animate();
</script>
</body>
</html>
