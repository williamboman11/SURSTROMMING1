<div id="startupError" role="alert"><h2>GAME DID NOT START</h2><p id="startupErrorText">The game engine has not finished loading. Check your internet connection and reload the page.</p><button type="button" onclick="location.reload()">RELOAD GAME</button></div>
<script>
(function () {
  var ready = false, timer;
  function report(message) {
    if (ready) return;
    var panel = document.getElementById('startupError');
    var text = document.getElementById('startupErrorText');
    if (panel && text) {
      text.textContent = message || 'The game engine failed to start. Check the browser console for the error.';
      panel.style.display = 'block';
    }
  }
  window.__setZombieGameReady = function () { ready = true; clearTimeout(timer); };
  window.addEventListener('error', function (e) {
    if (!ready) report('Startup error: ' + (e.message || 'A JavaScript module failed to load.') + ' Open F12 → Console and send me the first red error if it continues.');
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!ready) report('Startup error: ' + String(e.reason && (e.reason.message || e.reason) || 'A module promise failed.') + ' Check that the Three.js CDN is reachable from your website.');
  });
  document.addEventListener('DOMContentLoaded', function () {
    var buttons = document.getElementById('menuButtons');
    if (buttons) buttons.addEventListener('click', function () {
      if (!ready) report('The buttons are visible, but the game engine did not initialise. Open the browser console (F12 → Console) and send me the first red error.');
    });
    timer = setTimeout(function () {
      if (!ready) report('The game engine did not finish starting. This usually means the Three.js modules were blocked or a startup error stopped the game. Press F12 → Console and send me the first red error.');
    }, 12000);
  });
})();
</script>

function mkCanvas(size, h = size) { const c = document.createElement('canvas'); c.width = size; c.height = h; return [c, c.getContext('2d')]; }

function addNoise(ctx, w, h, amt) {

  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() - 0.5) * amt; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  ctx.putImageData(img, 0, 0);
}
function shade(hex, f) {

  const r = Math.min(255, ((c >> 16) & 255) * f) | 0, g = Math.min(255, ((c >> 8) & 255) * f) | 0, b = Math.min(255, (c & 255) * f) | 0;

}
function blob(x, size, px, py, r) {          // wrap-around circle so tiles stay seamless
  for (const ox of [0, size, -size]) for (const oy of [0, size, -size]) {
    const X = px + ox, Y = py + oy;
    if (X < -r || X > size + r || Y < -r || Y > size + r) continue;
    x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill();
  }
}

function boxGeo(w, h, d, den = 3) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f * 4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / den, uv.getY(i) * dims[f][1] / den);
  }
  uv.needsUpdate = true; return g;
}
function planeGeo(w, h, den = 3) {
  const g = new THREE.PlaneGeometry(w, h), uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / den, uv.getY(i) * h / den);
  uv.needsUpdate = true; return g;
}

  if (curMap.id === 'factory') for (const c of cottageDoors) if (inBox(c, x, z, pad)) return true;
  for (const o of obstacles) if (x > o.minX - pad && x < o.maxX + pad && z > o.minZ - pad && z < o.maxZ + pad) return true;
  return false;
}

    const lw = (dxp - dW / 2) - (cx - w / 2), rw = (cx + w / 2) - (dxp + dW / 2);
    wall(cx - w / 2 + lw / 2, fz, lw, T); wall(cx + w / 2 - rw / 2, fz, rw, T);

    const leaf = new THREE.Mesh(new THREE.BoxGeometry(dW, 2.2, 0.08), MAT.door); leaf.position.set(dW / 2, 1.1, 0); leaf.castShadow = true; pivot.add(leaf);

    cottageDoors.push({ id: o.door, cx, cz, w, d, doorX: dxp, doorZ: cz + d / 2, cost: 1000, open: false, t: 0, pivot, obs: ob, mesh: leaf });

function vbox(arr, w, h, d, x, y, z, color, jit = 0.07) {
  const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z);

  const j = 1 + (Math.random() - 0.5) * 2 * jit, n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r * j; a[i * 3 + 1] = c.g * j; a[i * 3 + 2] = c.b * j; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3)); arr.push(g);
}

    const c = col.isColor ? col : C(col), j = 1 + (Math.random() - 0.5) * 0.14, n = geo.attributes.position.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { a[i * 3] = c.r * j; a[i * 3 + 1] = c.g * j; a[i * 3 + 2] = c.b * j; }
    geo.setAttribute('color', new THREE.BufferAttribute(a, 3)); arr.push(geo);

=================================================================== */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // adaptive quality
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 2) {
    const fps = fpsFrames / fpsTime; fpsFrames = 0; fpsTime = 0;
    if (state.phase === 'playing' && locked) {
      if (fps < 32) lowCount++; else lowCount = 0;
      if (lowCount >= 2 && pixelRatio > 0.6) { pixelRatio = Math.max(0.6, pixelRatio - 0.15); renderer.setPixelRatio(pixelRatio); renderer.setSize(window.innerWidth, window.innerHeight); lowCount = 0; }
    }
  }

  if (state.phase === 'playing' && (locked || MP.on)) update(dt);
  else if (state.phase === 'menu') {
    state.time += dt; menuAngle += dt * 0.07;
    const mc = curMap.menuCam, r = mc.r + Math.sin(menuAngle * 2) * mc.rv;
    camera.position.set(mc.cx + Math.cos(menuAngle) * r, mc.h + Math.sin(menuAngle * 3) * 1.2, mc.cz + Math.sin(menuAngle) * r);
    camera.lookAt(mc.cx, mc.look, mc.cz);
    updateAmbient(dt); updateBox(dt); updateCan(dt); updateEffects(dt);

  if (state.phase === 'playing' || state.phase === 'countdown') updateAmbient(dt);

}

function activateMap(id) {
  const m = MAPS[id];
  if (!m.built) { Object.assign(m, m.build()); m.built = true; }
  for (const k in MAPS) if (MAPS[k].root) MAPS[k].root.visible = (k === id);
  curMap = m; obstacles = m.obs; obstacleMeshes = m.occ; AX = m.ax; AZ = m.az;
  // Invisible player-only no-go footprints under elevated scenery prevent out-of-bounds camping; they don't obstruct zombie navigation.
  playerAntiCamp = id === 'factory' ? [
    // Invisible footprint for the tall silo cluster; blocks using the scenery as an unreachable perch.
    {minX:-14.8,maxX:-4.2,minZ:-33.5,maxZ:-26.5}
  ] : []; 
  jug.pos.copy(m.jugPos); pap.pos.copy(m.papPos); pap.gear = m.papGear;
  mbox.pos.copy(m.boxPos); mbox.group.position.copy(m.boxPos); mbox.group.rotation.y = m.boxRot;
  scene.fog.density = m.fog;
  const sc = moon.shadow.camera; sc.left = -m.shadowX; sc.right = m.shadowX; sc.top = m.shadowZ; sc.bottom = -m.shadowZ; sc.updateProjectionMatrix();
  if (m.nav) {
    Object.assign(NAV, m.nav, { on: true, last: -1, t: 0 });
    if (!m.nav.reachDone) {
      navFlood(m.spawn.x, m.spawn.z);
      for (let i = 0; i < NAV.dist.length; i++) NAV.reach[i] = NAV.dist[i] < NAV_BIG ? 1 : 0;
      m.nav.reachDone = true;
    }
  } else NAV.on = false;
}

function cgeo(parts) {   // merge [geo, hex] parts into one vertex-coloured geometry

  lamp(-3, 34.4, 0, 1); lamp(-30, 34.4, 0, 1, false); lamp(22, 34.4, 0, 1, false); lamp(36.6, 12, -1, 0); lamp(36.6, -14, -1, 0, false); lamp(-6, -10, 1, 0); lamp(14, -14, 1, 0, false); lamp(-34, -12, 1, 0, false); lamp(52, -26, 0, 1);

  /* ---------- perks, mystery box ---------- */
  addPerk(-12, 7.55, PI, { title: 'JUGGER-NOG', fs: 30, body: '#a3141a', trim: '#f2f2f2', emb: 'J' });
  const pg = addPerk(0, -24.05, 0, { title: 'PACK-A-PUNCH', fs: 25, body: '#1c2a5e', trim: '#8a6bff', emb: 'P' });
  const gear = makePapGear(pg);
  { const pl = new THREE.PointLight(0x7a6bff, 14, 10, 2); pl.position.set(0, 2.6, -22.6); scene.add(pl); }
  const osPerks = [
    { id: 'quick', x: 12, z: 22.45, rot: 0, title: 'QUICK REVIVE', fs: 24, body: '#176cbd', trim: '#f2f2f2', emb: 'Q', cost: 500 },
    { id: 'speed', x: -20, z: -24.05, rot: 0, title: 'SPEED COLA', fs: 25, body: '#2d8d48', trim: '#e4f2d9', emb: 'S', cost: 3000 },
    { id: 'double', x: 39.55, z: 7.6, rot: -PI / 2, title: 'DOUBLE TAP', fs: 23, body: '#c5a321', trim: '#171717', emb: '2', cost: 2000 },
    { id: 'stamin', x: -36, z: 7.55, rot: PI, title: 'STAMIN-UP', fs: 25, body: '#6e8d35', trim: '#f2f2f2', emb: '↑', cost: 2000 },
    { id: 'mule', x: 50, z: -29.55, rot: 0, title: 'MULE KICK', fs: 26, body: '#d4631f', trim: '#2a1608', emb: 'M', cost: 4000 },
  ].map(q => { addPerk(q.x, q.z, q.rot, q); return { ...q, pos: new THREE.Vector3(q.x, 0, q.z) }; });
  block(22 - 0.55, 22 + 0.55, 29.8 - 0.85, 29.8 + 0.85); boxObs.osterled = obs[obs.length - 1]; occ.push(mbox.body);
  /* ---------- trees ---------- */
  const treeSpots = [[-22,-8],[-34,-17],[-18,-6.5],[12,-14],[2,-7],[-44,-38],[-24,-40],[-4,-40],[16,-38],[21,0],[21,14],[-55,26],[44,-4],[56,-4],[52,-20],[57,-24],[58,-10],[46,-2],[-50,-20],[-52,0],[22,-30],[-40,-30]];
  const treesBare = treeGeo(['#9fb46a', '#b9c58a', '#8da45a'], 1), treesPink = treeGeo(['#e3a9c0', '#d98fae', '#f0c4d2'], 1), feature = treeGeo(['#7a5a3a', '#6a4a2a', '#8a6a42', '#a07a4a'], 1.6);
  {
    const dm = new THREE.Object3D(), geoFor = i => (treeSpots[i][0] > 38 && treeSpots[i][1] > 20) || i % 4 === 0 ? treesPink : treesBare;
    const groups = new Map();
    treeSpots.forEach((p, i) => { const g = geoFor(i); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); block(p[0] - 0.3, p[0] + 0.3, p[1] - 0.3, p[1] + 0.3); });
    for (const [g, pts] of groups) {
      const im = new THREE.InstancedMesh(g, pineMat, pts.length);
      pts.forEach((p, i) => { dm.position.set(p[0], 0, p[1]); dm.scale.setScalar(rnd(1.0, 1.35)); dm.rotation.y = rnd(0, 6.28); dm.updateMatrix(); im.setMatrixAt(i, dm.matrix); });
      im.castShadow = im.receiveShadow = true; im.frustumCulled = false; scene.add(im);
    }
    const ft = new THREE.Mesh(feature, pineMat); ft.position.set(-17, 0.3, -2); ft.scale.setScalar(1.5); ft.castShadow = true; scene.add(ft);
    // forest ring + hills beyond the hedges
    const N = 170, inst = new THREE.InstancedMesh(pineGeo, pineMat, N); let i = 0;
    while (i < N) {
      const x = rnd(-120, 120), z = rnd(-130, 70);
      if (Math.abs(x) < AXo + 5 && z > -AZo - 5) continue;
      if (z > 30 && Math.abs(x) < 110) continue;
      dm.position.set(x, -0.3, z); dm.scale.setScalar(rnd(1.2, 2.2)); dm.rotation.y = rnd(0, 6.28); dm.updateMatrix(); inst.setMatrixAt(i++, dm.matrix);
    }
    inst.frustumCulled = false; scene.add(inst);
    const hillMat = new THREE.MeshStandardMaterial({ color: 0x1b2a1c, roughness: 1 });
    for (const [x, z, s] of [[-70, -105, 60], [10, -120, 75], [95, -100, 58], [-125, -30, 50], [125, -20, 52]]) { const h = new THREE.Mesh(new THREE.SphereGeometry(s, 14, 8), hillMat); h.scale.y = 0.38; h.position.set(x, -s * 0.12, z); scene.add(h); }
  }
  // houses across Esperedsvägen (decor only)
  const house2 = (x, z, w, d, h, wall, roofMat) => {
    const m = new THREE.Mesh(boxGeo(w, h, d, 3), std(null, { color: wall })); m.position.set(x, h / 2, z); m.receiveShadow = true; scene.add(m);
    addRoof(x, z, w, d, h, roofMat, 0.4, 0.6);
    for (let k = -1; k <= 1; k += 2) lw(x + k * w * 0.25, 1.9, z - d / 2 - 0.03, PI, 1.1, 1.2, Math.random() < 0.4 ? '#ffd88a' : '#1b2733');
    lw(x - w * 0.25, 4.8, z - d / 2 - 0.03, PI, 0.9, 1.0, '#ffcf75');
  };
  house2(-30, 60, 9, 8, 5, '#d9d6cc', MAT.shingle); house2(-12, 64, 8, 7, 4.6, '#7a4a3a', MAT.roofMetal); house2(12, 60, 9, 8, 5, '#e0ddd2', MAT.shingle); house2(36, 63, 8, 7, 4.5, '#c9c4b0', MAT.shingle); house2(62, 58, 9, 8, 5, '#d9d6cc', MAT.roofMetal);

  /* ---------- merge everything small ---------- */
  if (OG.length) { const dm = new THREE.Mesh(mergeGeometries(OG), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 })); dm.castShadow = dm.receiveShadow = true; scene.add(dm); }
  if (LW.length) scene.add(new THREE.Mesh(mergeGeometries(LW), MO.win));
  if (EM.length) scene.add(new THREE.Mesh(mergeGeometries(EM), MO.emis));
  if (CF.length) { const cf = new THREE.Mesh(mergeGeometries(CF), MO.chain); cf.receiveShadow = false; scene.add(cf); }

  const root = new THREE.Group(); scene.add(root);
  for (const c of scene.children.slice(w0)) if (c !== root) root.add(c);
  obstacles = sv.o; obstacleMeshes = sv.m; DT = sv.t;
  const m = {
    id: 'osterled', ax: AXo, az: AZo, fog: 0.012, shadowX: 72, shadowZ: 66,
    spawn: { x: -1.5, z: 35.2, yaw: 0 }, menuCam: { cx: 0, cz: 6, r: 78, rv: 4, h: 32, look: 2 },
    root, obs, occ, jugPos: new THREE.Vector3(-12, 0, 7.55), papPos: new THREE.Vector3(0, 0, -24.05), papGear: gear, boxPos: new THREE.Vector3(22, 0, 29.8), boxRot: PI / 2, perks: osPerks, gates,
    boxSpots: [{ x: 22, z: 29.8, rot: PI / 2 }, { x: -30, z: -12, rot: PI / 2 }, { x: 46, z: 20, rot: 0 }, { x: 31, z: -22, rot: PI / 2 }, { x: 46, z: -26, rot: 0 }, { x: -44, z: -10, rot: PI / 2 }],
    onReset() { for (const g of gates) g.reset(); if (m.nav) navRefresh(m); },
  };
  m.nav = buildNav(m); mapRef.m = m;
  return m;
}

/* ---------- boot ---------- */
activateMap('factory');
showMenu('main');
try {   // online counter: if the browser blocks the connection the game must still start
  MP.init();   // connect right away so the main menu can show who is online
  setInterval(() => { try { MP.presence(); } catch (e) {} }, 20000);
  window.addEventListener('pagehide', () => { try { if (MP.c && MP.c.connected) MP.c.publish(MP.PRE + 'online/' + MP.id, ''); } catch (e) {} });
  const oe = document.getElementById('online'), on = document.getElementById('onlineN');
  setInterval(() => { try { oe.style.display = state.phase === 'menu' ? 'block' : 'none'; const n = MP.onlineCount(); on.textContent = n > 0 ? n : '--'; } catch (e) {} }, 700);
} catch (e) {}
animate();
if (window.__setZombieGameReady) window.__setZombieGameReady();
var startupErrorPanel = document.getElementById('startupError'); if (startupErrorPanel) startupErrorPanel.style.display = 'none';
</script>
